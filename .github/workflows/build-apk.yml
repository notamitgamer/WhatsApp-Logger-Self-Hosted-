name: Build Native Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug works without any setup)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          build-tools: 34.0.0
          cmake-version: 3.22.1

      - name: Grant Gradle execute permission
        run: chmod +x ./android/gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Build Debug APK (no signing required)
        if: github.event.inputs.build_type == 'debug' || github.event_name == 'push'
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (requires keystore secrets)
        if: github.event.inputs.build_type == 'release' && github.event_name == 'workflow_dispatch'
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_android_signing_store_file: ${{ secrets.KEYSTORE_FILE }}
          ORG_GRADLE_PROJECT_android_signing_store_password: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_android_signing_key_alias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_android_signing_key_password: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release AAB (for Play Store, on tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          cd android
          ./gradlew :app:bundleRelease --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_android_signing_store_file: ${{ secrets.KEYSTORE_FILE }}
          ORG_GRADLE_PROJECT_android_signing_store_password: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_android_signing_key_alias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_android_signing_key_password: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-logger.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-logger-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Release AAB
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-logger-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}